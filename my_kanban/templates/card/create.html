{% extends 'card/base.html' %}

{% block title %}
<title>Create new card</title>
{% endblock %}

{% block header_title %}
<h1>Create new card</h1>
{% endblock %}

{% block style %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/card_create.css') }}">
{% endblock %}


{% block content %}
<main>
    <form action="{{ url_for('board.show', board_id=board_id) }}" method="get">
        <button class="board-button">Back to the board</button>
    </form>

    <section class="card-info">
        <form id="create-card-form" data-board-id="{{ board_id }}">
            <textarea class="card-title" name="title" placeholder="Enter title" required></textarea>
            <textarea class="card-content" name="content" placeholder="Enter content"></textarea>
            <button class="board-button">Create</button>
        </form>
    </section>
</main>

<script src="{{ url_for('static', filename='js/card_create.js') }}" type="module"></script>

{% endblock %}
